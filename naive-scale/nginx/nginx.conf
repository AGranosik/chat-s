# Each proxied websocket uses two connection slots (downstream + upstream), so
# the effective client ceiling is worker_connections / 2 (per worker). Raised
# well past the Go servers' capacity so nginx is never the bottleneck while
# load-testing the app's limits. The matching fd limit must be lifted too
# (worker_rlimit_nofile + the container ulimit).
worker_processes auto;
worker_rlimit_nofile 262144;

events {
    worker_connections 65536; # ÷2 slots/ws ⇒ ~32k ws per worker
}

http {
    # Map the Upgrade header so websocket connections proxy correctly.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # naive-scale: the scaling seam is realized as three server instances.
    # Stateless REST round-robins across them for even load.
    upstream chat_backend {
        server server1:8080;
        server server2:8080;
        server server3:8080;
    }

    # Websockets route by room affinity (docs/plans/2026-07-09-room-affinity-routing.md):
    # every member of ?room=<id> hashes to the same instance, so a room's fan-out
    # is an in-process write instead of a Redis delivery to every instance.
    # Redis pub/sub stays as the cross-instance bridge — the outbox relay that
    # claims a message may run on a different instance than the room's owner
    # (PUBLISH now reaches exactly 1 subscriber), and a hot room that must span
    # instances later still gets delivery through it. `consistent` (ketama) so a
    # scale event remaps only ~1/N of rooms. An empty $arg_room buckets to one
    # instance, but the app 400s those before upgrading — malformed URLs only.
    upstream chat_ws_backend {
        hash $arg_room consistent;
        server server1:8080;
        server server2:8080;
        server server3:8080;
    }

    server {
        listen 80;

        location /ws {
            proxy_pass http://chat_ws_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s; # keep long-lived ws connections open
        }

        location / {
            proxy_pass http://chat_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
