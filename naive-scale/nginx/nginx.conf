worker_processes auto;
worker_rlimit_nofile 262144;

events {
    worker_connections 65536;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream chat_backend {
        server server1:8080;
        server server2:8080;
        server server3:8080;
        server server4:8080;
        server server5:8080;
        server server6:8080;
        server server7:8080;
        server server8:8080;
        server server9:8080;
        server server10:8080;
        server server11:8080;
        server server12:8080;
        server server13:8080;
        server server14:8080;
        server server15:8080;
    }

    upstream chat_ws_backend {
        hash $arg_room consistent;
        server server1:8080;
        server server2:8080;
        server server3:8080;
        server server4:8080;
        server server5:8080;
        server server6:8080;
        server server7:8080;
        server server8:8080;
        server server9:8080;
        server server10:8080;
        server server11:8080;
        server server12:8080;
        server server13:8080;
        server server14:8080;
        server server15:8080;
    }

    server {
        listen 80;

        location /ws {
            proxy_pass http://chat_ws_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://chat_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
