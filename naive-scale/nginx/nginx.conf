# Each proxied websocket uses two connection slots (downstream + upstream), so
# the effective client ceiling is worker_connections / 2 (per worker). Raised
# well past the Go servers' capacity so nginx is never the bottleneck while
# load-testing the app's limits. The matching fd limit must be lifted too
# (worker_rlimit_nofile + the container ulimit).
worker_processes auto;
worker_rlimit_nofile 262144;

events {
    worker_connections 65536; # ÷2 slots/ws ⇒ ~32k ws per worker
}

http {
    # Map the Upgrade header so websocket connections proxy correctly.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # naive-scale: the scaling seam is realized as three server instances. nginx
    # round-robins across them. There is no shared broadcaster yet, so clients
    # pinned to different instances won't see each other's messages — that gap
    # *is* the experiment this approach measures.
    upstream chat_backend {
        server server1:8080;
        server server2:8080;
        server server3:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://chat_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s; # keep long-lived ws connections open
        }
    }
}
