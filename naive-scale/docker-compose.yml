version: "3.9"

# Shared definition for the eight server instances. naive-scale runs N copies of
# the same process behind nginx (the "just add more boxes" reflex) — hence the
# anchor. Each instance gets the same 33m / 0.5 CPU chat-tier budget as one
# proper-scale chat server, so 8 instances match proper-scale's chat tier.
x-server: &server
  build:
    context: .
    dockerfile: Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    DATABASE_URL: postgres://chat:chat@postgres:5432/chat?sslmode=disable
    HTTP_ADDR: ":8080"
    REDIS_ADDR: redis:6379
  expose:
    - "8080" # internal only: reachable by nginx on the compose network, never published to the host
  restart: on-failure
  # Each proxied websocket is one fd on the server; the daemon default (often
  # 1024) caps us near ~1000 conns. Raised high enough that fds never bind
  # before the memory budget does. somaxconn deepens the accept queue so a
  # connect burst doesn't overflow it and get RST (Go sizes the listen backlog
  # from net.core.somaxconn).
  ulimits:
    nofile:
      soft: 262144
      hard: 262144
  sysctls:
    net.core.somaxconn: 65535
  deploy:
    resources:
      limits:
        memory: 87m
        cpus: "0.80"

services:
  postgres:
    image: postgres:16
    container_name: chat-postgres
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          # Fixed DB budget so Postgres doesn't eat host RAM and mask the
          # servers' own memory wall.
          memory: 600m
          cpus: "2.00"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    mem_limit: 200m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 200m
          cpus: "1.00"

  server1:
    <<: *server
    container_name: chat-server-1

  server2:
    <<: *server
    container_name: chat-server-2

  server3:
    <<: *server
    container_name: chat-server-3

  server4:
    <<: *server
    container_name: chat-server-4

  server5:
    <<: *server
    container_name: chat-server-5

  server6:
    <<: *server
    container_name: chat-server-6

  server7:
    <<: *server
    container_name: chat-server-7

  server8:
    <<: *server
    container_name: chat-server-8

  server9:
    <<: *server
    container_name: chat-server-9

  server10:
    <<: *server
    container_name: chat-server-10

  nginx:
    image: nginx:1.27-alpine
    container_name: chat-nginx
    depends_on:
      - server1
      - server2
      - server3
      - server4
      - server5
      - server6
      - server7
      - server8
      - server9
      - server10
    ports:
      - "80:80"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          # Headroom so nginx is never the wall — the 8x33m servers are the SUT.
          memory: 512m
          cpus: "1.00"
