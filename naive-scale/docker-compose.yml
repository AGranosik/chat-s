version: "3.9"

x-server: &server
  build:
    context: .
    dockerfile: Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    DATABASE_URL: "postgres://chat:chat@postgres:5432/chat?sslmode=disable&pool_max_conns=8"
    HTTP_ADDR: ":8080"
    REDIS_ADDR: redis:6379
  expose:
    - "8080"
  restart: on-failure
  ulimits:
    nofile:
      soft: 262144
      hard: 262144
  sysctls:
    net.core.somaxconn: 65535
  deploy:
    resources:
      limits:
        memory: 100m
        cpus: "0.50"

services:
  postgres:
    image: postgres:16
    container_name: chat-postgres
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 600m
          cpus: "2.50"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    mem_limit: 200m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 200m
          cpus: "1.00"

  server1:
    <<: *server
    container_name: chat-server-1

  server2:
    <<: *server
    container_name: chat-server-2

  server3:
    <<: *server
    container_name: chat-server-3

  server4:
    <<: *server
    container_name: chat-server-4

  server5:
    <<: *server
    container_name: chat-server-5

  server6:
    <<: *server
    container_name: chat-server-6

  server7:
    <<: *server
    container_name: chat-server-7

  server8:
    <<: *server
    container_name: chat-server-8

  server9:
    <<: *server
    container_name: chat-server-9

  server10:
    <<: *server
    container_name: chat-server-10

  server11:
    <<: *server
    container_name: chat-server-11

  server12:
    <<: *server
    container_name: chat-server-12

  server13:
    <<: *server
    container_name: chat-server-13

  server14:
    <<: *server
    container_name: chat-server-14

  server15:
    <<: *server
    container_name: chat-server-15

  nginx:
    image: nginx:1.27-alpine
    container_name: chat-nginx
    depends_on:
      - server1
      - server2
      - server3
      - server4
      - server5
      - server6
      - server7
      - server8
      - server9
      - server10
      - server11
      - server12
      - server13
      - server14
      - server15
    ports:
      - "80:80"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "2.50"
