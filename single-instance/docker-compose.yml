version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: chat-postgres
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          # Fixed budget under test, same as the server: keeps Postgres from
          # eating host RAM and masking the server's own 600m wall.
          memory: 600m

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat?sslmode=disable
      HTTP_ADDR: ":8080"
    expose:
      - "8080" # internal only: reachable by nginx on the compose network, never published to the host
    restart: on-failure
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    sysctls:
      net.core.somaxconn: 65535
    deploy:
      resources:
        limits:
          memory: 99m
          cpus: "0.50"

  nginx:
    image: nginx:1.27-alpine
    container_name: chat-nginx
    depends_on:
      - server
    ports:
      - "80:80"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          # Headroom so nginx is never the wall — the 600m server is the SUT.
          memory: 512m
