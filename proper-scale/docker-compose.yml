version: "3.9"

x-server: &server
  build:
    context: .
    dockerfile: /services/message_service/Dockerfile
  depends_on:
    kafka:
      condition: service_healthy      
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  expose:
    - "8080" # internal only: reachable by nginx on the compose network, never published to the host
  restart: on-failure
  ulimits:
    nofile:
      soft: 262144
      hard: 262144
  sysctls:
    net.core.somaxconn: 65535
  deploy:
    resources:
      limits:
        memory: 145m


services:
  postgres:
    image: postgres:16
    container_name: chat-postgres
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 600m
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    hostname: kafka
    ports:
      - "29092:29092"
 
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
 
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
 
      # --- Single-broker cluster: replication/ISR must be 1, not the Kafka defaults of 3 ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
 
      # --- Convenience for local dev; turn off if you want explicit topic creation ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_DIRS: /var/lib/kafka/data
 
    volumes:
      - kafka-data:/var/lib/kafka/data
 
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
 
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy  
  presence_service:
    build:
      context: .
      dockerfile: /services/presence_service/Dockerfile
    container_name: presence_service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
    expose:
      - "8080" 
    restart: on-failure
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    sysctls:
      net.core.somaxconn: 65535
    deploy:
      resources:
        limits:
          memory: 80m
        
  # relay_service:
  #   build:
  #     context: ./services/relay_service
  #     dockerfile: Dockerfile
  #   container_name: chat-relay
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     DATABASE_URL: postgres://chat:chat@postgres:5432/chat?sslmode=disable
  #     HTTP_ADDR: ":8080"
  #   expose:
  #     - "8080" # internal only: reachable by nginx on the compose network, never published to the host
  #   restart: on-failure
  #   ulimits:
  #     nofile:
  #       soft: 262144
  #       hard: 262144
  #   sysctls:
  #     net.core.somaxconn: 65535
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 80m


  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    mem_limit: 200m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 200m

  server1:
    <<: *server
    container_name: chat-server-1
    environment:
      DIAL: chat-server-1
      PresenceService: presence_service:9090

  # server2:
  #   <<: *server
  #   container_name: chat-server-2

  # server3:
  #   <<: *server
  #   container_name: chat-server-3

  nginx:
    image: nginx:1.27-alpine
    container_name: chat-nginx
    depends_on:
      - server1
    #   - server2
    #   - server3
    ports:
      - "80:80"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          # Headroom so nginx is never the wall — the 3x200m servers are the SUT.
          memory: 512m

volumes:
  kafka-data:
