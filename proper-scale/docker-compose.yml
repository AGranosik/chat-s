version: "3.9"

x-server: &server
  build:
    context: .
    dockerfile: services/message_service/Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
    presence_service:
      condition: service_started
    redis:
      condition: service_healthy
  expose:
    - "8080"
  restart: on-failure
  ulimits:
    nofile:
      soft: 262144
      hard: 262144
  sysctls:
    net.core.somaxconn: 65535
  deploy:
    resources:
      limits:
        memory: 33m
        cpus: "0.3"

x-server-db-env: &server-db-env
  DATABASE_URL: "postgres://chat:chat@postgres:5432/chat?sslmode=disable&pool_max_conns=8"


services:
  postgres:
    image: postgres:16
    container_name: chat-postgres
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 600m
          cpus: "2.50"
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    hostname: kafka
    ports:
      - "29092:29092"
 
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
 
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
 
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
 
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 24
      KAFKA_LOG_DIRS: /var/lib/kafka/data
 
    volumes:
      - kafka-data:/var/lib/kafka/data
 
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: "1.00"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    profiles: ["tools"]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy  
  presence_service:
    build:
      context: .
      dockerfile: services/presence_service/Dockerfile
    container_name: presence_service
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "9090"
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 80m
          cpus: "0.50"
        
  delivery_service:
    build:
      context: .
      dockerfile: services/delivery_service/Dockerfile
    container_name: delivery_service
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: 
      KAFKA_BROKERS: "kafka:9092"  
      REDIS_ADDR: redis:6379  
    expose:
      - "8080"
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 80m
          cpus: "0.50"

  delivery_service_1:
    build:
      context: .
      dockerfile: services/delivery_service/Dockerfile
    container_name: delivery_service_1
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: "kafka:9092"
      REDIS_ADDR: redis:6379
    expose:
      - "8080"
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 80m
          cpus: "0.50"

  outbox_relay:
    build:
      context: .
      dockerfile: services/outbox_relay/Dockerfile
    container_name: outbox-relay
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      server1:
        condition: service_started
    environment:
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: messages
      BATCH_SIZE: "500"
      SHARD_COUNT: "3"
      SHARD_ID: "0"
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 100m
          cpus: "0.50"

  outbox_relay_1:
    build:
      context: .
      dockerfile: services/outbox_relay/Dockerfile
    container_name: outbox-relay-1
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      server1:
        condition: service_started
    environment:
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: messages
      BATCH_SIZE: "500"
      SHARD_COUNT: "3"
      SHARD_ID: "1"
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 100m
          cpus: "0.50"

  outbox_relay_2:
    build:
      context: .
      dockerfile: services/outbox_relay/Dockerfile
    container_name: outbox-relay-2
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      server1:
        condition: service_started
    environment:
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: messages
      BATCH_SIZE: "500"
      SHARD_COUNT: "3"
      SHARD_ID: "2"
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 100m
          cpus: "0.50"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    mem_limit: 200m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 200m
          cpus: "1.00"

  server1:
    <<: *server
    container_name: chat-server-1
    environment:
      <<: *server-db-env
      DIAL: chat-server-1
      PresenceService: presence_service:9090
      REDIS_ADDR: redis:6379

  server2:
    <<: *server
    container_name: chat-server-2
    environment:
      <<: *server-db-env
      DIAL: chat-server-2
      PresenceService: presence_service:9090
      REDIS_ADDR: redis:6379

  server3:
    <<: *server
    container_name: chat-server-3
    environment:
      <<: *server-db-env
      DIAL: chat-server-3
      PresenceService: presence_service:9090
      REDIS_ADDR: redis:6379

  server4:
    <<: *server
    container_name: chat-server-4
    environment:
      <<: *server-db-env
      DIAL: chat-server-4
      PresenceService: presence_service:9090
      REDIS_ADDR: redis:6379

  server5:
    <<: *server
    container_name: chat-server-5
    environment:
      <<: *server-db-env
      DIAL: chat-server-5
      PresenceService: presence_service:9090
      REDIS_ADDR: redis:6379

  nginx:
    image: nginx:1.27-alpine
    container_name: chat-nginx
    depends_on:
      - server1
      - server2
      - server3
      - server4
      - server5
    ports:
      - "80:80"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "2.50"

volumes:
  kafka-data:
  rabbitmq_data:
