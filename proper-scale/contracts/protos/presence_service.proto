syntax = "proto3";

package myservice.v1;

option go_package = "github.com/you/myrepo/gen/myservice/v1;myservicev1";

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string id = 1;
  string name = 2;
  string email = 3;
}